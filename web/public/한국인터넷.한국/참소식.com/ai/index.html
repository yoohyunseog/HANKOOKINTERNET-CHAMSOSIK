<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>참소식 Ollama IDE</title>
  <meta name="description" content="참소식.com Ollama AI IDE">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #111827;
      --panel-2: #162033;
      --panel-3: #0f172a;
      --line: #263247;
      --line-2: #334155;
      --text: #e5edf8;
      --muted: #92a0b5;
      --soft: #cbd5e1;
      --green: #22c55e;
      --cyan: #38bdf8;
      --blue: #2563eb;
      --amber: #f59e0b;
      --red: #ef4444;
      --shadow: 0 20px 60px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: #070b16;
      font-family: Consolas, "Cascadia Mono", "Noto Sans KR", "Malgun Gothic", monospace;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .ide {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 320px;
      grid-template-rows: 48px minmax(0, 1fr) 32px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, .12), transparent 35%),
        linear-gradient(315deg, rgba(34, 197, 94, .09), transparent 34%),
        var(--bg);
      overflow: hidden;
    }

    .titlebar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, .94);
      padding: 0 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
    }

    .brand span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      font-size: 12px;
    }

    .window-actions,
    .toolbar,
    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--line-2);
    }

    .dot.red { background: #ff5f57; }
    .dot.amber { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .toolbar button,
    .icon-button,
    .tab,
    .send-button,
    .quick-button {
      min-height: 34px;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      color: var(--text);
      background: #182235;
      font-weight: 800;
    }

    .toolbar button,
    .tab {
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar button:hover,
    .icon-button:hover,
    .tab:hover,
    .quick-button:hover,
    .send-button:hover {
      border-color: rgba(56, 189, 248, .65);
      background: #1d2b45;
    }

    .left {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-right: 1px solid var(--line);
      background: rgba(15, 23, 42, .86);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .right {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-left: 1px solid var(--line);
      background: rgba(15, 23, 42, .86);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .section {
      border-bottom: 1px solid var(--line);
      padding: 14px;
      min-width: 0;
    }

    .section h2 {
      margin: 0 0 11px;
      color: var(--soft);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .new-chat {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(34, 197, 94, .55);
      border-radius: 7px;
      color: #ecfdf5;
      background: #14532d;
      font-weight: 900;
    }

    .conversation-list {
      display: grid;
      gap: 7px;
    }

    .conversation {
      width: 100%;
      min-height: 42px;
      display: grid;
      gap: 3px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 8px 9px;
      color: var(--soft);
      background: transparent;
      text-align: left;
    }

    .conversation.active,
    .conversation:hover {
      border-color: var(--line-2);
      background: #172033;
    }

    .conversation span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 900;
    }

    .conversation small {
      color: var(--muted);
      font-size: 11px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .field input,
    .field select,
    .field textarea {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      color: var(--text);
      background: #0b1220;
      padding: 9px 10px;
      outline: none;
    }

    .field textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.55;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus,
    .composer textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .14);
    }

    .quick-grid {
      display: grid;
      gap: 8px;
    }

    .quick-button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      text-align: left;
      font-size: 12px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: 43px minmax(0, 1fr) 180px;
      background: rgba(11, 16, 32, .92);
      overflow: hidden;
    }

    .tabs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 24, 39, .9);
      padding: 5px 8px;
      overflow-x: auto;
    }

    .tab.active {
      border-color: rgba(34, 197, 94, .55);
      color: #dcfce7;
      background: #123525;
    }

    .chat {
      min-height: 0;
      height: 100%;
      overflow: auto;
      padding: 18px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .empty {
      max-width: 820px;
      margin: 7vh auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 39, .7);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .empty h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .message {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 12px;
      max-width: 1040px;
      margin: 0 auto 16px;
    }

    .role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      padding-top: 12px;
    }

    .bubble {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 39, .82);
      padding: 13px 14px;
      line-height: 1.68;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .13);
      font-family: "Noto Sans KR", "Malgun Gothic", Consolas, monospace;
    }

    .message.user .bubble {
      border-color: rgba(56, 189, 248, .34);
      background: rgba(15, 23, 42, .98);
    }

    .message.assistant .role {
      color: var(--green);
    }

    .message.streaming .bubble {
      border-color: rgba(56, 189, 248, 0.5);
      animation: pulse-border 1.5s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(56, 189, 248, 0.3); }
      50% { border-color: rgba(56, 189, 248, 0.7); }
    }

    .typing-indicator {
      display: inline-flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      animation: bounce 1.4s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(15, 23, 42, .96);
      padding: 12px;
    }

    .composer form {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 10px;
    }

    .composer textarea {
      width: 100%;
      min-height: 104px;
      resize: none;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--text);
      background: #08111f;
      padding: 12px 13px;
      line-height: 1.55;
      outline: none;
    }

    .send-button {
      min-height: 104px;
      border-color: rgba(34, 197, 94, .62);
      color: #ecfdf5;
      background: #166534;
      font-size: 15px;
    }

    .send-button:disabled {
      border-color: var(--line-2);
      color: var(--muted);
      background: #1f2937;
      cursor: wait;
    }

    .console {
      min-height: 126px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #070b12;
      color: #a7f3d0;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.55;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      padding: 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--text);
      font-size: 16px;
    }

    .statusbar {
      grid-column: 1 / -1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #08111f;
      padding: 0 12px;
      font-size: 12px;
      overflow: hidden;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .status-left {
      flex: 1 1 auto;
      overflow: hidden;
    }

    .status-right {
      flex: 0 1 auto;
      overflow: hidden;
    }

    .status-left span,
    .status-right span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .pulse.online {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, .14);
    }

    @media (max-width: 1060px) {
      .ide {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .right {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .ide {
        height: 100dvh;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(180px, 34dvh) minmax(0, 1fr) 32px;
      }

      .titlebar {
        min-height: 52px;
        flex-wrap: wrap;
        padding: 8px 10px;
      }

      .left {
        min-height: 0;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        grid-template-rows: 43px minmax(0, 1fr) 190px;
        min-height: 620px;
      }

      .message {
        grid-template-columns: 1fr;
      }

      .role {
        text-align: left;
        padding-top: 0;
      }

      .composer form {
        grid-template-columns: 1fr;
      }

      .send-button {
        min-height: 44px;
      }

      .status-right {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="ide">
    <header class="titlebar">
      <a class="brand" href="../">
        <span class="brand-mark">AI</span>
        <span>참소식 Ollama IDE</span>
      </a>
      <div class="toolbar" aria-label="도구">
        <button type="button" id="healthButton">연결확인</button>
        <button type="button" id="searchToggleButton" style="border-color: rgba(100,100,100,0.3);">🔍 웹검색</button>
        <button type="button" id="copyButton">복사</button>
        <button type="button" id="clearButton">초기화</button>
      </div>
      <div class="window-actions" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
      </div>
    </header>

    <aside class="left">
      <section class="section">
        <button class="new-chat" type="button" id="newChatButton">+ 새 대화</button>
      </section>

      <section class="section">
        <h2>워크스페이스</h2>
        <div class="conversation-list" id="conversationList"></div>
      </section>

      <section class="section">
        <h2>빠른 프롬프트</h2>
        <div class="quick-grid">
          <button class="quick-button" type="button" data-prompt="이 뉴스 원문을 핵심 요약, 쟁점, 확인 필요 항목으로 정리해줘.">뉴스 분석</button>
          <button class="quick-button" type="button" data-prompt="참소식.com에 올릴 기사 제목 7개와 짧은 리드문을 만들어줘.">기사 제목</button>
          <button class="quick-button" type="button" data-prompt="아래 내용을 팩트체크 체크리스트로 바꿔줘.">팩트체크</button>
          <button class="quick-button" type="button" data-prompt="이 코드를 문제점, 수정 방향, 개선된 코드 순서로 리뷰해줘.">코드 리뷰</button>
        </div>
      </section>
    </aside>

    <main class="workspace">
      <nav class="tabs" aria-label="작업 탭">
        <button class="tab active" type="button">chat.md</button>
        <button class="tab" type="button">prompt.json</button>
        <button class="tab" type="button">console.log</button>
      </nav>

      <section class="chat" id="chatLog" aria-live="polite"></section>

      <section class="composer">
        <form id="chatForm">
          <textarea id="promptInput" placeholder="메시지를 입력하세요. Enter로 전송, Shift+Enter로 줄바꿈" autocomplete="off"></textarea>
          <button class="send-button" type="submit" id="sendButton">실행</button>
        </form>
      </section>
    </main>

    <aside class="right">
      <section class="section">
        <h2>Ollama 연결</h2>
        <div class="field">
          <label for="endpointInput">원격 서버 API URL</label>
          <input id="endpointInput" type="url" value="http://211.45.162.155:11434" placeholder="http://211.45.162.155:11434">
        </div>
        <div class="field">
          <label for="modelInput">Model</label>
          <input id="modelInput" type="text" value="glm-5:cloud" placeholder="glm-5:cloud, gemma4:31b-cloud">
        </div>
        <div class="field">
          <label for="temperatureInput">Temperature</label>
          <select id="temperatureInput">
            <option value="0.2">0.2 정확</option>
            <option value="0.5" selected>0.5 균형</option>
            <option value="0.8">0.8 창의</option>
          </select>
        </div>
      </section>

      <section class="section">
        <h2>System Prompt</h2>
        <div class="field">
          <label for="systemInput">역할</label>
          <textarea id="systemInput"></textarea>
        </div>
      </section>

      <section class="section">
        <h2>런타임</h2>
        <div class="metric-grid">
          <div class="metric"><span>상태</span><strong id="stateMetric">대기</strong></div>
          <div class="metric"><span>대화</span><strong id="countMetric">0</strong></div>
          <div class="metric"><span>지연</span><strong id="latencyMetric">-</strong></div>
          <div class="metric"><span>모드</span><strong id="modeMetric">API</strong></div>
        </div>
      </section>

      <section class="section">
        <h2>Console</h2>
        <pre class="console" id="consoleLog"></pre>
      </section>
    </aside>

    <footer class="statusbar">
      <div class="status-left">
        <span class="status-pill"><span class="pulse" id="statusPulse"></span><span id="statusText">ngrok 서버 대기</span></span>
        <span id="baseText">/api/chat</span>
      </div>
      <div class="status-right">
        <span>Enter 실행</span>
        <span>localStorage 자동 저장</span>
      </div>
    </footer>
  </div>

  <script>
    // 원격 서버 Ollama 설정
    const REMOTE_SERVER = "http://211.45.162.155:11434";
    const OLLAMA_API_KEY = "d8cf2811037b4791b2e36ffb4afee830.LrLvzfuvzutO7MLHciyiUtpq";
    
    const DEFAULT_ENDPOINT = REMOTE_SERVER;
    const DEFAULT_MODEL = "glm-5:cloud";
    const LEGACY_ENDPOINTS = [
      "https://gilbert-bases-tracked-hopes.trycloudflare.com",
      "https://cyclopedically-orthogenetic-sienna.ngrok-free.dev",
      "https://corporate-value-sailing-position.trycloudflare.com"
    ];
    const LEGACY_MODELS = ["kimi-k2.6:cloud", "deepseek-v4-flash:cloud"];
    const storageKey = "chamsosik-ollama-ide-state";

    const els = {
      chatLog: document.querySelector("#chatLog"),
      chatForm: document.querySelector("#chatForm"),
      promptInput: document.querySelector("#promptInput"),
      sendButton: document.querySelector("#sendButton"),
      endpointInput: document.querySelector("#endpointInput"),
      modelInput: document.querySelector("#modelInput"),
      temperatureInput: document.querySelector("#temperatureInput"),
      systemInput: document.querySelector("#systemInput"),
      conversationList: document.querySelector("#conversationList"),
      consoleLog: document.querySelector("#consoleLog"),
      stateMetric: document.querySelector("#stateMetric"),
      countMetric: document.querySelector("#countMetric"),
      latencyMetric: document.querySelector("#latencyMetric"),
      modeMetric: document.querySelector("#modeMetric"),
      statusPulse: document.querySelector("#statusPulse"),
      statusText: document.querySelector("#statusText"),
      baseText: document.querySelector("#baseText"),
      newChatButton: document.querySelector("#newChatButton"),
      clearButton: document.querySelector("#clearButton"),
      copyButton: document.querySelector("#copyButton"),
      healthButton: document.querySelector("#healthButton")
    };

    let state = loadState();
    let activeId = state.activeId || state.conversations[0]?.id;
    let webSearchEnabled = true; // 웹 검색 항상 ON

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        if (saved && Array.isArray(saved.conversations)) {
          // 이전 Cloudflare 터널 URL이면 기본값으로 초기화
          const endpoint = saved.endpoint || DEFAULT_ENDPOINT;
          const cleanEndpoint = endpoint.includes('trycloudflare.com') ? DEFAULT_ENDPOINT : endpoint;
          return {
            conversations: saved.conversations,
            activeId: saved.activeId,
            endpoint: cleanEndpoint,
            model: saved.model || DEFAULT_MODEL,
            temperature: saved.temperature || "0.5",
            system: saved.system || els.systemInput.value
          };
        }
      } catch (error) {}

      return {
        conversations: [createConversation("새 대화")],
        endpoint: DEFAULT_ENDPOINT,
        model: DEFAULT_MODEL,
        temperature: "0.5",
        system: els.systemInput.value
      };
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({
        ...state,
        activeId,
        endpoint: els.endpointInput.value.trim(),
        model: els.modelInput.value.trim(),
        temperature: els.temperatureInput.value,
        system: els.systemInput.value
      }));
    }

    function createConversation(title) {
      return {
        id: `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        createdAt: new Date().toISOString(),
        messages: []
      };
    }

    function currentConversation() {
      return state.conversations.find((item) => item.id === activeId) || state.conversations[0];
    }

    function endpointBase() {
      const value = els.endpointInput.value.trim();
      const isLegacy = LEGACY_ENDPOINTS.some((endpoint) => value.replace(/\/$/, "") === endpoint);
      const base = /^https?:\/\//i.test(value) && !isLegacy ? value : DEFAULT_ENDPOINT;
      return base
        .replace(/\/api\/chat\/?$/, "")
        .replace(/\/health\/?$/, "")
        .replace(/\/$/, "");
    }

    function candidateBases() {
      const bases = [endpointBase()];
      // 원격 서버 Ollama 추가
      if (!bases.includes(REMOTE_SERVER)) {
        bases.push(REMOTE_SERVER);
      }
      const canTryLocalhost = window.location.protocol !== "https:";
      if (canTryLocalhost && !bases.includes("http://127.0.0.1:11434")) {
        bases.push("http://127.0.0.1:11434");
      }
      return bases;
    }

    function candidateChatUrls() {
      const urls = ["/api/ollama-chat"];
      // 원격 서버 Ollama API 직접 호출
      urls.push(`${REMOTE_SERVER}/api/chat`);
      // Fallback URL (Cloudflare Tunnel 등)
      for (const base of candidateBases()) {
        if (base !== REMOTE_SERVER && !urls.includes(`${base}/api/chat`)) {
          urls.push(`${base}/api/chat`);
        }
      }
      return urls;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value = new Date()) {
      return new Date(value).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

      renderConversations();
      renderMessages();
      updateMetrics();
      els.baseText.textContent = `${endpointBase()}/api/chat`;

    function normalizeReply(data) {
      if (typeof data === "string") return data;
      if (data.content) return data.content;
      if (data.reply) return data.reply;
      if (data.answer) return data.answer;
      if (data.message && typeof data.message === "string") return data.message;
      if (data.message?.content) return data.message.content;
      if (data.response) return data.response;
      if (data.choices?.[0]?.message?.content) return data.choices[0].message.content;
      if (data.choices?.[0]?.text) return data.choices[0].text;
      return JSON.stringify(data, null, 2);
    }

    // RAG 라우터: 키워드 기반 검색 필요성 판단
    async function analyzeSearchNeed(query, conversation) {
      // 검색이 필요한 키워드 패턴
      const searchKeywords = [
        // 시간 관련
        '최신', '최근', '오늘', '어제', '이번', '지난', '올해', '작년',
        '지금', '현재', '요즘', '신규', '새로운', '새로',
        // 정보 검색
        '검색', '찾아', '조회', '확인', '알려', '뭐', '무엇', '어디', '누구',
        '어떤', '어느', '언제', '왜', '어떻게',
        // 뉴스/이슈
        '뉴스', '기사', '소식', '이슈', '사건', '사고', '발생',
        '보도', '기자', '언론',
        // 실시간 정보
        '날씨', '온도', '비', '눈', '미세먼지', '날짜', '시간',
        '주가', '주식', '환율', '시세', '가격',
        // 비교/추천
        '비교', '추천', '순위', '랭킹', 'best', 'top',
        // 상태
        '현황', '상황', '동향', '트렌드', '유행'
      ];
      
      // 검색이 필요 없는 패턴 (일반 대화, 창작, 분석)
      const noSearchKeywords = [
        '코드', '작성', '만들어', '생성', '번역', '요약해', '정리해',
        '수정', '변경', '개선', '리팩토링',
        '이야기', '소설', '시', '글', '에세이',
        '계산', '수학', '공식',
        '안녕', '반가워', '고마워', '감사', '잘했', '좋아'
      ];
      
      const queryLower = query.toLowerCase();
      
      // 검색 필요 키워드 매칭
      const searchMatches = searchKeywords.filter(kw => queryLower.includes(kw));
      // 검색 불필요 키워드 매칭
      const noSearchMatches = noSearchKeywords.filter(kw => queryLower.includes(kw));
      
      // 점수 계산
      const searchScore = searchMatches.length;
      const noSearchScore = noSearchMatches.length;
      
      // 판단 로직
      const needsSearch = searchScore > 0 && searchScore >= noSearchScore;
      
      // 검색 키워드 추출
      const keywords = needsSearch ? extractKeywords(query) : [];
      
      const result = {
        needsSearch,
        reason: needsSearch 
          ? `검색 키워드 감지: ${searchMatches.join(', ')}` 
          : (noSearchScore > 0 
            ? `일반 대화 감지: ${noSearchMatches.join(', ')}` 
            : '직접 응답'),
        keywords,
        confidence: Math.min(1, (Math.abs(searchScore - noSearchScore) + 1) / 3),
        matchedKeywords: searchMatches
      };
      
      log(`🔍 검색 판단: ${result.needsSearch ? '검색필요' : '직접응답'} - ${result.reason}`);
      return result;
    }

    // 질문에서 검색 키워드 추출
    function extractKeywords(query) {
      // 불용어 제거
      const stopWords = ['은', '는', '이', '가', '을', '를', '에', '의', '와', '과', '도', '다', '요', '좀', '좀', '어때', '알려줘', '말해줘', '가르쳐'];
      let cleaned = query;
      stopWords.forEach(w => cleaned = cleaned.replace(new RegExp(w, 'g'), ' '));
      
      // 공백으로 분리하고 중요 단어만 추출
      const words = cleaned.split(/\s+/).filter(w => w.length >= 2);
      
      // 상위 3개 키워드 반환
      return words.slice(0, 3);
    }

    // 스마트 채팅: AI가 검색 필요성 판단 후 처리
    async function smartChat(prompt) {
      const model = els.modelInput.value.trim() || DEFAULT_MODEL;
      const conversation = currentConversation();
      const systemPrompt = els.systemInput.value.trim();

      // 1단계: 검색 필요성 판단 (80% 확률)
      log("🤖 검색 필요성 판단 중...");
      const analysis = await analyzeSearchNeed(prompt, conversation);

      // 2단계: 검색이 필요하면 웹 검색 수행
      let searchResults = null;
      let searchContext = "";

      if (analysis.needsSearch && analysis.keywords.length > 0) {
        log(`🔍 검색 키워드: ${analysis.keywords.join(', ')}`);
        
        // 웹 검색 수행
        const searchData = await webSearch(analysis.keywords.join(' '), 5);
        if (searchData.results && searchData.results.length > 0) {
          searchResults = searchData.results;
          log(`✅ 검색 완료: ${searchResults.length}건`);
          
          // 상위 2개 결과 실제 크롤링
          log(`📄 상위 결과 크롤링 중...`);
          const fetchPromises = searchResults.slice(0, 2).map(async (r, i) => {
            try {
              const fetched = await webFetch(r.url);
              if (fetched.content) {
                r.content = fetched.content; // 전체 내용 저장 (자르지 않음)
                log(`   [${i + 1}] 크롤링 성공: ${(r.title || '제목없음').slice(0, 30)}`);
              }
            } catch (e) {
              log(`   [${i + 1}] 크롤링 실패: ${e.message.slice(0, 50)}`);
            }
            return r;
          });
          
          // 크롤링 완료 대기
          await Promise.all(fetchPromises);
          
          // 검색 결과를 컨텍스트로 변환 (전체 내용 포함)
          searchContext = "\n\n[웹 검색 결과]\n" + searchResults.map((r, i) => {
            const content = r.content || r.snippet || r.description || '';
            return `[${i + 1}] ${r.title || '제목 없음'}\n${r.url}\n${content}\n---`;
          }).join('\n\n');
        }
      } else {
        log(`💬 직접 응답: ${analysis.reason}`);
      }

      // 3단계: AI에 최종 요청
      const messages = [
        { role: "system", content: systemPrompt },
        ...conversation.messages.slice(-12).map((item) => ({ role: item.role, content: item.content }))
      ];

      // 검색 결과가 있으면 사용자 메시지에 컨텍스트 추가
      const enhancedPrompt = searchContext 
        ? `${prompt}\n\n[참고: 위 검색 결과를 활용하여 답변하세요. 출처를 반드시 표시하세요.]${searchContext}`
        : prompt;

      try {
        const response = await fetch("/api/ollama-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            messages: [
              ...messages,
              { role: "user", content: enhancedPrompt }
            ],
            temperature: Number(els.temperatureInput.value),
            num_predict: 32768  // 최대 긴 응답 허용
          })
        });

        const text = await response.text();
        if (!response.ok) {
          throw new Error(`AI request failed: ${response.status}`);
        }

        let reply;
        try {
          const data = JSON.parse(text);
          reply = normalizeReply(data);
        } catch {
          reply = text;
        }

        return {
          content: reply,
          search: searchResults ? { results: searchResults, analysis } : null,
          analysis
        };
      } catch (error) {
        log(`smart chat error: ${error.message}`);
        throw error;
      }
    }

    // 스트리밍 응답 처리
    async function streamAI(prompt, onChunk, onComplete) {
      const model = els.modelInput.value.trim() || DEFAULT_MODEL;
      const conversation = currentConversation();
      const systemPrompt = els.systemInput.value.trim();
      
      // 검색 필요성 판단
      let searchResults = null;
      let searchContext = "";
      
      if (webSearchEnabled) {
        const analysis = await analyzeSearchNeed(prompt, conversation);
        
        if (analysis.needsSearch && analysis.keywords.length > 0) {
          log(`🔍 검색 키워드: ${analysis.keywords.join(', ')}`);
          
          const searchData = await webSearch(analysis.keywords.join(' '), 5);
          if (searchData.results && searchData.results.length > 0) {
            searchResults = searchData.results;
            log(`✅ 검색 완료: ${searchResults.length}건`);
            
            // 상위 2개 결과 크롤링
            const fetchPromises = searchResults.slice(0, 2).map(async (r, i) => {
              try {
                const fetched = await webFetch(r.url);
                if (fetched.content) {
                  r.content = fetched.content;
                  log(`   [${i + 1}] 크롤링 성공: ${(r.title || '제목없음').slice(0, 30)}`);
                }
              } catch (e) {
                log(`   [${i + 1}] 크롤링 실패: ${e.message.slice(0, 50)}`);
              }
              return r;
            });
            await Promise.all(fetchPromises);
            
            searchContext = "\n\n[웹 검색 결과]\n" + searchResults.map((r, i) => {
              const content = r.content || r.snippet || r.description || '';
              return `[${i + 1}] ${r.title || '제목 없음'}\n${r.url}\n${content}\n---`;
            }).join('\n\n');
          }
        }
      }
      
      // 메시지 구성
      const messages = [
        { role: "system", content: systemPrompt },
        ...conversation.messages.slice(-12).map((item) => ({ role: item.role, content: item.content }))
      ];
      
      const enhancedPrompt = searchContext 
        ? `${prompt}\n\n[참고: 위 검색 결과를 활용하여 답변하세요. 출처를 반드시 표시하세요.]${searchContext}`
        : prompt;

      // 스트리밍 API 호출
      const body = {
        model,
        messages: [...messages, { role: "user", content: enhancedPrompt }],
        stream: true,
        temperature: Number(els.temperatureInput.value)
      };

      let lastError = null;
      for (const url of candidateChatUrls()) {
        try {
          const sameOriginProxy = url === "/api/ollama-chat";
          log(`POST ${url} model=${model} stream=true`);
          
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": sameOriginProxy ? "application/json" : "text/plain",
              "Authorization": `Bearer ${OLLAMA_API_KEY}`
            },
            body: JSON.stringify(body)
          });

          if (!response.ok) {
            const text = await response.text();
            throw new Error(`${url} ${response.status} ${text.slice(0, 180)}`);
          }

          // 스트리밍 응답 처리
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullContent = "";
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            
            for (const line of lines) {
              if (!line.trim() || line.startsWith(":")) continue;
              
              try {
                const data = JSON.parse(line);
                if (data.message?.content) {
                  fullContent += data.message.content;
                  onChunk(data.message.content, fullContent);
                } else if (data.response) {
                  // Ollama 기본 형식
                  fullContent += data.response;
                  onChunk(data.response, fullContent);
                } else if (data.content) {
                  fullContent += data.content;
                  onChunk(data.content, fullContent);
                }
              } catch (e) {
                // JSON 파싱 실패 시 텍스트로 처리
                if (line.trim()) {
                  fullContent += line;
                  onChunk(line, fullContent);
                }
              }
            }
          }

          onComplete(fullContent, searchResults);
          return;
        } catch (error) {
          lastError = error;
          log(`stream failed on ${url}: ${error.message}`);
        }
      }

      throw lastError || new Error("all streaming endpoints failed");
    }

    async function requestAI(prompt) {
      const model = els.modelInput.value.trim() || DEFAULT_MODEL;
      const conversation = currentConversation();
      const messages = [
        { role: "system", content: els.systemInput.value.trim() },
        ...conversation.messages.slice(-12).map((item) => ({ role: item.role, content: item.content }))
      ];

      const body = {
        model,
        messages,
        message: prompt,
        prompt,
        temperature: Number(els.temperatureInput.value)
      };

      // 웹 검색이 켜져 있으면 스트리밍 사용
      if (webSearchEnabled) {
        // 스트리밍 응답 반환 (Promise로 래핑)
        return new Promise((resolve, reject) => {
          let fullContent = "";
          streamAI(
            prompt,
            (chunk, accumulated) => {
              // 실시간 업데이트
              fullContent = accumulated;
            },
            (content, searchResults) => {
              resolve({ content, search: searchResults ? { results: searchResults } : null });
            }
          ).catch(reject);
        });
      }

      let lastError = null;
      for (const url of candidateChatUrls()) {
        try {
          const sameOriginProxy = url === "/api/ollama-chat";
          log(`POST ${url} model=${model}`);
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": sameOriginProxy ? "application/json" : "text/plain",
              "Authorization": `Bearer ${OLLAMA_API_KEY}`
            },
            body: JSON.stringify(body)
          });

          const text = await response.text();
          if (!response.ok) {
            throw new Error(`${url} ${response.status} ${text.slice(0, 180)}`);
          }

          try {
            return normalizeReply(JSON.parse(text));
          } catch (error) {
            return text;
          }
        } catch (error) {
          lastError = error;
          log(`request failed on ${url}: ${error.message}`);
        }
      }

      throw lastError || new Error("all endpoints failed");
    }

    // 웹 검색 + AI 채팅 요청 (스마트 라우팅: 뉴스는 검색+요약, 일반은 바로 Ollama)
    async function requestAIWithSearch(body) {
      const model = body.model || DEFAULT_MODEL;
      const searchQuery = body.search_query || body.prompt || body.message || '';

      log(`POST /api/ollama-chat-with-search model=${model} search=on`);

      try {
        const response = await fetch("/api/ollama-chat-with-search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            messages: body.messages || [{ role: "user", content: searchQuery }],
            query: searchQuery,
            temperature: body.temperature || 0.35,
            num_predict: 1200
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(`search chat ${response.status}: ${data.error || 'unknown'}`);
        }

        // 검색 결과가 있으면 로그에 표시
        if (data.search?.results?.length > 0) {
          log(`web search: ${data.search.results.length} results`);
          data.search.results.slice(0, 3).forEach((item, i) => {
            log(`  [${i+1}] ${(item.title || 'untitled').slice(0, 50)}`);
          });
        }
        if (data.mode === 'smart-chat-news') {
          log(`mode: 뉴스 검색+요약 (${data.search?.fetched || 0}건 본문 추출)`);
        } else {
          log(`mode: 직접 응답`);
        }

        return {
          content: data.content || normalizeReply(data),
          search: data.search || null
        };
      } catch (error) {
        log(`smart chat failed: ${error.message}`);
        // 실패 시 일반 채팅으로 폴백
        log("falling back to normal chat...");
        for (const url of candidateChatUrls()) {
          try {
            const sameOriginProxy = url === "/api/ollama-chat";
            const fallbackRes = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": sameOriginProxy ? "application/json" : "text/plain" },
              body: JSON.stringify(body)
            });
            const text = await fallbackRes.text();
            if (fallbackRes.ok) return { content: normalizeReply(JSON.parse(text)), search: null };
          } catch (e) {}
        }
        throw error;
      }
    }

    async function submitPrompt(event) {
      event.preventDefault();
      const prompt = els.promptInput.value.trim();
      if (!prompt) return;

      const conversation = currentConversation();
      if (!conversation.title || conversation.title === "새 대화") {
        conversation.title = prompt.slice(0, 34);
      }

      // 사용자 메시지 추가
      conversation.messages.push({ role: "user", content: prompt, time: formatTime() });
      els.promptInput.value = "";
      els.sendButton.disabled = true;
      updateMetrics("실행");
      render();

      // AI 응답 placeholder 추가 (스트리밍용)
      const aiMsgIndex = conversation.messages.length;
      conversation.messages.push({
        role: "assistant",
        content: "",
        time: formatTime(),
        model: els.modelInput.value.trim()
      });
      render();

      const started = performance.now();
      
      try {
        // 스트리밍 응답 처리
        await streamAI(
          prompt,
          // onChunk: 실시간 업데이트
          (chunk, accumulated) => {
            conversation.messages[aiMsgIndex].content = accumulated;
            render();
            scrollChatToBottom();
          },
          // onComplete: 완료
          (fullContent, searchResults) => {
            const ms = Math.round(performance.now() - started);
            els.latencyMetric.textContent = `${ms}ms`;
            
            conversation.messages[aiMsgIndex].content = fullContent;
            if (searchResults) {
              conversation.messages[aiMsgIndex].searchResults = searchResults;
            }
            
            setOnline(true, "AI 응답 완료");
            log(`streaming complete ${ms}ms`);
            saveState();
            render();
          }
        );
      } catch (error) {
        // 에러 시 fallback
        conversation.messages[aiMsgIndex].content = fallbackReply(prompt);
        setOnline(false, "API 응답 실패");
        log(`request failed: ${error.message}`);
        render();
      } finally {
        els.sendButton.disabled = false;
        updateMetrics("대기");
      }
    }

    function newChat() {
      const chat = createConversation("새 대화");
      state.conversations.unshift(chat);
      activeId = chat.id;
      render();
      els.promptInput.focus();
    }

    function clearCurrent() {
      const conversation = currentConversation();
      if (!conversation) return;
      conversation.messages = [];
      conversation.title = "새 대화";
      els.endpointInput.value = DEFAULT_ENDPOINT;
      log("current chat cleared");
      render();
    }

    async function copyChat() {
      const conversation = currentConversation();
      const text = (conversation?.messages || [])
        .map((item) => `${item.role.toUpperCase()}: ${item.content}`)
        .join("\n\n");
      if (!text) {
        log("copy skipped: empty chat");
        return;
      }
      await navigator.clipboard.writeText(text);
      log("chat copied to clipboard");
    }

    const savedEndpoint = (state.endpoint || "").replace(/\/$/, "");
    els.endpointInput.value = /^https?:\/\//i.test(savedEndpoint) && !LEGACY_ENDPOINTS.includes(savedEndpoint)
      ? savedEndpoint
      : DEFAULT_ENDPOINT;
    els.modelInput.value = LEGACY_MODELS.includes(state.model || "") ? DEFAULT_MODEL : (state.model || DEFAULT_MODEL);
    els.temperatureInput.value = state.temperature || "0.5";
    els.systemInput.value = state.system || els.systemInput.value;

    els.chatForm.addEventListener("submit", submitPrompt);
    els.newChatButton.addEventListener("click", newChat);
    els.clearButton.addEventListener("click", clearCurrent);
    els.copyButton.addEventListener("click", copyChat);
    els.healthButton.addEventListener("click", checkHealth);
    els.endpointInput.addEventListener("input", render);
    els.modelInput.addEventListener("input", saveState);
    els.temperatureInput.addEventListener("change", saveState);
    els.systemInput.addEventListener("input", saveState);

    // 웹 검색 토글 (초기 ON)
    const searchToggleBtn = document.querySelector("#searchToggleButton");
    searchToggleBtn.style.borderColor = "rgba(34, 197, 94, 0.8)";
    searchToggleBtn.style.background = "#166534";
    searchToggleBtn.style.color = "#ecfdf5";
    searchToggleBtn.textContent = "🔍 검색ON";
    searchToggleBtn.addEventListener("click", () => {
      webSearchEnabled = !webSearchEnabled;
      searchToggleBtn.style.borderColor = webSearchEnabled ? "rgba(34, 197, 94, 0.8)" : "rgba(100,100,100,0.3)";
      searchToggleBtn.style.background = webSearchEnabled ? "#166534" : "#182235";
      searchToggleBtn.style.color = webSearchEnabled ? "#ecfdf5" : "var(--text)";
      searchToggleBtn.textContent = webSearchEnabled ? "🔍 검색ON" : "🔍 웹검색";
      log(`web search ${webSearchEnabled ? "enabled" : "disabled"}`);
    });

    els.promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        els.chatForm.requestSubmit();
      }
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        els.promptInput.value = button.dataset.prompt;
        els.promptInput.focus();
      });
    });

    log("참소식 Ollama IDE ready");
    log(`default endpoint: ${DEFAULT_ENDPOINT}/api/chat`);
    render();
    loadTunnelUrl();
    checkHealth();
  </script>
</body>
</html>
