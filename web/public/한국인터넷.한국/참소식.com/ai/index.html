<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>참소식 Ollama IDE</title>
  <meta name="description" content="참소식.com Ollama AI IDE">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #111827;
      --panel-2: #162033;
      --panel-3: #0f172a;
      --line: #263247;
      --line-2: #334155;
      --text: #e5edf8;
      --muted: #92a0b5;
      --soft: #cbd5e1;
      --green: #22c55e;
      --cyan: #38bdf8;
      --blue: #2563eb;
      --amber: #f59e0b;
      --red: #ef4444;
      --shadow: 0 20px 60px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: #070b16;
      font-family: Consolas, "Cascadia Mono", "Noto Sans KR", "Malgun Gothic", monospace;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .ide {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 320px;
      grid-template-rows: 48px minmax(0, 1fr) 32px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, .12), transparent 35%),
        linear-gradient(315deg, rgba(34, 197, 94, .09), transparent 34%),
        var(--bg);
      overflow: hidden;
    }

    .titlebar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, .94);
      padding: 0 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      text-decoration: none;
      font-weight: 900;
    }

    .brand span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      font-size: 12px;
    }

    .window-actions,
    .toolbar,
    .status-left,
    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--line-2);
    }

    .dot.red { background: #ff5f57; }
    .dot.amber { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .toolbar button,
    .icon-button,
    .tab,
    .send-button,
    .quick-button {
      min-height: 34px;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      color: var(--text);
      background: #182235;
      font-weight: 800;
    }

    .toolbar button,
    .tab {
      padding: 7px 10px;
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar button:hover,
    .icon-button:hover,
    .tab:hover,
    .quick-button:hover,
    .send-button:hover {
      border-color: rgba(56, 189, 248, .65);
      background: #1d2b45;
    }

    .left {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-right: 1px solid var(--line);
      background: rgba(15, 23, 42, .86);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .right {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-left: 1px solid var(--line);
      background: rgba(15, 23, 42, .86);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .section {
      border-bottom: 1px solid var(--line);
      padding: 14px;
      min-width: 0;
    }

    .section h2 {
      margin: 0 0 11px;
      color: var(--soft);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .new-chat {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(34, 197, 94, .55);
      border-radius: 7px;
      color: #ecfdf5;
      background: #14532d;
      font-weight: 900;
    }

    .conversation-list {
      display: grid;
      gap: 7px;
    }

    .conversation {
      width: 100%;
      min-height: 42px;
      display: grid;
      gap: 3px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 8px 9px;
      color: var(--soft);
      background: transparent;
      text-align: left;
    }

    .conversation.active,
    .conversation:hover {
      border-color: var(--line-2);
      background: #172033;
    }

    .conversation span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 900;
    }

    .conversation small {
      color: var(--muted);
      font-size: 11px;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .field input,
    .field select,
    .field textarea {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line-2);
      border-radius: 7px;
      color: var(--text);
      background: #0b1220;
      padding: 9px 10px;
      outline: none;
    }

    .field textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.55;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus,
    .composer textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, .14);
    }

    .quick-grid {
      display: grid;
      gap: 8px;
    }

    .quick-button {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      text-align: left;
      font-size: 12px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-rows: 43px minmax(0, 1fr) 180px;
      background: rgba(11, 16, 32, .92);
      overflow: hidden;
    }

    .tabs {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 24, 39, .9);
      padding: 5px 8px;
      overflow-x: auto;
    }

    .tab.active {
      border-color: rgba(34, 197, 94, .55);
      color: #dcfce7;
      background: #123525;
    }

    .chat {
      min-height: 0;
      height: 100%;
      overflow: auto;
      padding: 18px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }

    .empty {
      max-width: 820px;
      margin: 7vh auto 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 39, .7);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .empty h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .message {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 12px;
      max-width: 1040px;
      margin: 0 auto 16px;
    }

    .role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      padding-top: 12px;
    }

    .bubble {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 39, .82);
      padding: 13px 14px;
      line-height: 1.68;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 10px 22px rgba(0, 0, 0, .13);
      font-family: "Noto Sans KR", "Malgun Gothic", Consolas, monospace;
    }

    .message.user .bubble {
      border-color: rgba(56, 189, 248, .34);
      background: rgba(15, 23, 42, .98);
    }

    .message.assistant .role {
      color: var(--green);
    }

    .meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: rgba(15, 23, 42, .96);
      padding: 12px;
    }

    .composer form {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 10px;
    }

    .composer textarea {
      width: 100%;
      min-height: 104px;
      resize: none;
      border: 1px solid var(--line-2);
      border-radius: 8px;
      color: var(--text);
      background: #08111f;
      padding: 12px 13px;
      line-height: 1.55;
      outline: none;
    }

    .send-button {
      min-height: 104px;
      border-color: rgba(34, 197, 94, .62);
      color: #ecfdf5;
      background: #166534;
      font-size: 15px;
    }

    .send-button:disabled {
      border-color: var(--line-2);
      color: var(--muted);
      background: #1f2937;
      cursor: wait;
    }

    .console {
      min-height: 126px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #070b12;
      color: #a7f3d0;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.55;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1220;
      padding: 10px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      color: var(--text);
      font-size: 16px;
    }

    .statusbar {
      grid-column: 1 / -1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      background: #08111f;
      padding: 0 12px;
      font-size: 12px;
      overflow: hidden;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }

    .status-left {
      flex: 1 1 auto;
      overflow: hidden;
    }

    .status-right {
      flex: 0 1 auto;
      overflow: hidden;
    }

    .status-left span,
    .status-right span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }

    .pulse.online {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, .14);
    }

    @media (max-width: 1060px) {
      .ide {
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .right {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .ide {
        height: 100dvh;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(180px, 34dvh) minmax(0, 1fr) 32px;
      }

      .titlebar {
        min-height: 52px;
        flex-wrap: wrap;
        padding: 8px 10px;
      }

      .left {
        min-height: 0;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .workspace {
        grid-template-rows: 43px minmax(0, 1fr) 190px;
        min-height: 620px;
      }

      .message {
        grid-template-columns: 1fr;
      }

      .role {
        text-align: left;
        padding-top: 0;
      }

      .composer form {
        grid-template-columns: 1fr;
      }

      .send-button {
        min-height: 44px;
      }

      .status-right {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="ide">
    <header class="titlebar">
      <a class="brand" href="../">
        <span class="brand-mark">AI</span>
        <span>참소식 Ollama IDE</span>
      </a>
      <div class="toolbar" aria-label="도구">
        <button type="button" id="healthButton">연결확인</button>
        <button type="button" id="searchToggleButton" style="border-color: rgba(100,100,100,0.3);">🔍 웹검색</button>
        <button type="button" id="copyButton">복사</button>
        <button type="button" id="clearButton">초기화</button>
      </div>
      <div class="window-actions" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
      </div>
    </header>

    <aside class="left">
      <section class="section">
        <button class="new-chat" type="button" id="newChatButton">+ 새 대화</button>
      </section>

      <section class="section">
        <h2>워크스페이스</h2>
        <div class="conversation-list" id="conversationList"></div>
      </section>

      <section class="section">
        <h2>빠른 프롬프트</h2>
        <div class="quick-grid">
          <button class="quick-button" type="button" data-prompt="이 뉴스 원문을 핵심 요약, 쟁점, 확인 필요 항목으로 정리해줘.">뉴스 분석</button>
          <button class="quick-button" type="button" data-prompt="참소식.com에 올릴 기사 제목 7개와 짧은 리드문을 만들어줘.">기사 제목</button>
          <button class="quick-button" type="button" data-prompt="아래 내용을 팩트체크 체크리스트로 바꿔줘.">팩트체크</button>
          <button class="quick-button" type="button" data-prompt="이 코드를 문제점, 수정 방향, 개선된 코드 순서로 리뷰해줘.">코드 리뷰</button>
        </div>
      </section>
    </aside>

    <main class="workspace">
      <nav class="tabs" aria-label="작업 탭">
        <button class="tab active" type="button">chat.md</button>
        <button class="tab" type="button">prompt.json</button>
        <button class="tab" type="button">console.log</button>
      </nav>

      <section class="chat" id="chatLog" aria-live="polite"></section>

      <section class="composer">
        <form id="chatForm">
          <textarea id="promptInput" placeholder="메시지를 입력하세요. Enter로 전송, Shift+Enter로 줄바꿈" autocomplete="off"></textarea>
          <button class="send-button" type="submit" id="sendButton">실행</button>
        </form>
      </section>
    </main>

    <aside class="right">
      <section class="section">
        <h2>Ollama 연결</h2>
        <div class="field">
          <label for="endpointInput">Fallback API Base URL</label>
          <input id="endpointInput" type="url" value="">
        </div>
        <div class="field">
          <label for="modelInput">Model</label>
          <input id="modelInput" type="text" value="deepseek-v4-flash:cloud">
        </div>
        <div class="field">
          <label for="temperatureInput">Temperature</label>
          <select id="temperatureInput">
            <option value="0.2">0.2 정확</option>
            <option value="0.5" selected>0.5 균형</option>
            <option value="0.8">0.8 창의</option>
          </select>
        </div>
      </section>

      <section class="section">
        <h2>System Prompt</h2>
        <div class="field">
          <label for="systemInput">역할</label>
          <textarea id="systemInput">너는 참소식.com의 한국어 AI 어시스턴트다. 답변은 명확하고 실용적으로 작성한다. 확인되지 않은 사실은 단정하지 말고, 필요한 경우 확인해야 할 항목을 분리한다.</textarea>
        </div>
      </section>

      <section class="section">
        <h2>런타임</h2>
        <div class="metric-grid">
          <div class="metric"><span>상태</span><strong id="stateMetric">대기</strong></div>
          <div class="metric"><span>대화</span><strong id="countMetric">0</strong></div>
          <div class="metric"><span>지연</span><strong id="latencyMetric">-</strong></div>
          <div class="metric"><span>모드</span><strong id="modeMetric">API</strong></div>
        </div>
      </section>

      <section class="section">
        <h2>Console</h2>
        <pre class="console" id="consoleLog"></pre>
      </section>
    </aside>

    <footer class="statusbar">
      <div class="status-left">
        <span class="status-pill"><span class="pulse" id="statusPulse"></span><span id="statusText">ngrok 서버 대기</span></span>
        <span id="baseText">/api/chat</span>
      </div>
      <div class="status-right">
        <span>Enter 실행</span>
        <span>localStorage 자동 저장</span>
      </div>
    </footer>
  </div>

  <script>
    const DEFAULT_ENDPOINT = "https://gilbert-bases-tracked-hopes.trycloudflare.com";
    const DEFAULT_MODEL = "deepseek-v4-flash:cloud";
    const LEGACY_ENDPOINTS = [
      "https://cyclopedically-orthogenetic-sienna.ngrok-free.dev",
      "https://corporate-value-sailing-position.trycloudflare.com"
    ];
    const LEGACY_MODELS = ["kimi-k2.6:cloud"];
    const storageKey = "chamsosik-ollama-ide-state";

    const els = {
      chatLog: document.querySelector("#chatLog"),
      chatForm: document.querySelector("#chatForm"),
      promptInput: document.querySelector("#promptInput"),
      sendButton: document.querySelector("#sendButton"),
      endpointInput: document.querySelector("#endpointInput"),
      modelInput: document.querySelector("#modelInput"),
      temperatureInput: document.querySelector("#temperatureInput"),
      systemInput: document.querySelector("#systemInput"),
      conversationList: document.querySelector("#conversationList"),
      consoleLog: document.querySelector("#consoleLog"),
      stateMetric: document.querySelector("#stateMetric"),
      countMetric: document.querySelector("#countMetric"),
      latencyMetric: document.querySelector("#latencyMetric"),
      modeMetric: document.querySelector("#modeMetric"),
      statusPulse: document.querySelector("#statusPulse"),
      statusText: document.querySelector("#statusText"),
      baseText: document.querySelector("#baseText"),
      newChatButton: document.querySelector("#newChatButton"),
      clearButton: document.querySelector("#clearButton"),
      copyButton: document.querySelector("#copyButton"),
      healthButton: document.querySelector("#healthButton")
    };

    let state = loadState();
    let activeId = state.activeId || state.conversations[0]?.id;
    let webSearchEnabled = true; // 웹 검색 항상 ON

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        if (saved && Array.isArray(saved.conversations)) {
          return {
            conversations: saved.conversations,
            activeId: saved.activeId,
            endpoint: saved.endpoint || DEFAULT_ENDPOINT,
            model: saved.model || DEFAULT_MODEL,
            temperature: saved.temperature || "0.5",
            system: saved.system || els.systemInput.value
          };
        }
      } catch (error) {}

      return {
        conversations: [createConversation("새 대화")],
        endpoint: DEFAULT_ENDPOINT,
        model: DEFAULT_MODEL,
        temperature: "0.5",
        system: els.systemInput.value
      };
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({
        ...state,
        activeId,
        endpoint: els.endpointInput.value.trim(),
        model: els.modelInput.value.trim(),
        temperature: els.temperatureInput.value,
        system: els.systemInput.value
      }));
    }

    function createConversation(title) {
      return {
        id: `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        title,
        createdAt: new Date().toISOString(),
        messages: []
      };
    }

    function currentConversation() {
      return state.conversations.find((item) => item.id === activeId) || state.conversations[0];
    }

    function endpointBase() {
      const value = els.endpointInput.value.trim();
      const isLegacy = LEGACY_ENDPOINTS.some((endpoint) => value.replace(/\/$/, "") === endpoint);
      const base = /^https?:\/\//i.test(value) && !isLegacy ? value : DEFAULT_ENDPOINT;
      return base
        .replace(/\/api\/chat\/?$/, "")
        .replace(/\/health\/?$/, "")
        .replace(/\/$/, "");
    }

    function candidateBases() {
      const bases = [endpointBase()];
      const canTryLocalhost = window.location.protocol !== "https:";
      if (canTryLocalhost && !bases.includes("http://127.0.0.1:3110")) {
        bases.push("http://127.0.0.1:3110");
      }
      return bases;
    }

    function candidateChatUrls() {
      if (window.location.protocol === "https:") {
        return ["/api/ollama-chat"];
      }

      return [
        "/api/ollama-chat",
        ...candidateBases().map((base) => `${base}/api/chat`)
      ];
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value = new Date()) {
      return new Date(value).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function render() {
      renderConversations();
      renderMessages();
      updateMetrics();
      els.baseText.textContent = `${endpointBase()}/api/chat`;
      saveState();
    }

    function renderConversations() {
      els.conversationList.innerHTML = state.conversations.map((item) => {
        const active = item.id === activeId ? " active" : "";
        const count = item.messages.length;
        return `<button class="conversation${active}" type="button" data-id="${item.id}">
          <span>${escapeHtml(item.title || "새 대화")}</span>
          <small>${count} messages</small>
        </button>`;
      }).join("");

      els.conversationList.querySelectorAll("[data-id]").forEach((button) => {
        button.addEventListener("click", () => {
          activeId = button.dataset.id;
          render();
        });
      });
    }

    function renderMessages() {
      const conversation = currentConversation();
      if (!conversation || !conversation.messages.length) {
        els.chatLog.innerHTML = `<div class="empty">
          <h1>Ollama 작업공간</h1>
          <p>질문을 보내면 먼저 같은 도메인의 <strong>/api/ollama-chat</strong>으로 요청합니다. 서버에 Ollama가 있으면 실제 모델이 답하고, 없으면 서버 내장 응답으로 전환됩니다.</p>
          <p style="margin-top:12px;color:var(--cyan);font-weight:900;">🔍 상단 <strong>웹검색</strong> 버튼을 누르면 AI가 실시간 웹 검색 결과를 참고하여 답변합니다.</p>
        </div>`;
        scrollChatToBottom();
        return;
      }

      els.chatLog.innerHTML = conversation.messages.map((message) => {
        const roleLabel = message.role === "user" ? "USER" : "AI";
        let extraHtml = "";
        // 검색 결과가 있으면 표시
        if (message.searchResults && message.searchResults.length > 0) {
          extraHtml = `<details style="margin-top:8px;font-size:12px;color:var(--muted);">
            <summary style="cursor:pointer;font-weight:900;">🔍 검색결과 ${message.searchResults.length}건</summary>
            <div style="margin-top:6px;display:grid;gap:6px;">
              ${message.searchResults.slice(0, 5).map((item, i) =>
                `<div style="padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,0.03);">
                  <div style="font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(item.title || 'Untitled')}</div>
                  <div style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cyan);">${escapeHtml(item.url || '')}</div>
                </div>`
              ).join('')}
            </div>
          </details>`;
        }
        return `<article class="message ${message.role}">
          <div class="role">${roleLabel}</div>
          <div>
            <div class="bubble">${escapeHtml(message.content)}${extraHtml}</div>
            <div class="meta">${escapeHtml(message.model || "")} ${escapeHtml(message.time || "")}</div>
          </div>
        </article>`;
      }).join("");
      scrollChatToBottom();
    }

    function scrollChatToBottom() {
      requestAnimationFrame(() => {
        els.chatLog.scrollTop = els.chatLog.scrollHeight;
        requestAnimationFrame(() => {
          els.chatLog.scrollTop = els.chatLog.scrollHeight;
        });
      });
    }

    function updateMetrics(status = "대기") {
      const conversation = currentConversation();
      els.stateMetric.textContent = status;
      els.countMetric.textContent = conversation ? conversation.messages.length : 0;
      els.modeMetric.textContent = els.endpointInput.value.trim() ? "API" : "로컬";
    }

    function log(line) {
      const stamp = new Date().toLocaleTimeString("ko-KR");
      els.consoleLog.textContent += `[${stamp}] ${line}\n`;
      els.consoleLog.scrollTop = els.consoleLog.scrollHeight;
    }

    function setOnline(ok, text) {
      els.statusPulse.classList.toggle("online", ok);
      els.statusText.textContent = text;
    }

    function normalizeReply(data) {
      if (typeof data === "string") return data;
      if (data.content) return data.content;
      if (data.reply) return data.reply;
      if (data.answer) return data.answer;
      if (data.message && typeof data.message === "string") return data.message;
      if (data.message?.content) return data.message.content;
      if (data.response) return data.response;
      if (data.choices?.[0]?.message?.content) return data.choices[0].message.content;
      if (data.choices?.[0]?.text) return data.choices[0].text;
      return JSON.stringify(data, null, 2);
    }

    async function checkHealth() {
      const started = performance.now();
      updateMetrics("확인");
      log("GET /api/ollama-health");

      try {
        const response = await fetch("/api/ollama-health");
        const data = await response.json().catch(() => ({}));
        const ms = Math.round(performance.now() - started);
        els.latencyMetric.textContent = `${ms}ms`;
        const connected = data.ollama === "ok";
        setOnline(connected, connected ? "AI 연결됨" : "내장 응답 모드");
        log(`health ${response.status} ${data.mode || ""} ${data.ollama || ""} ${ms}ms`);
      } catch (error) {
        setOnline(false, "연결 확인 실패");
        log(`health failed: ${error.message}`);
      } finally {
        updateMetrics("대기");
      }
    }

    async function loadTunnelUrl() {
      try {
        const response = await fetch("/api/ai-tunnel-url", { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        const url = String(data.url || "").trim().replace(/\/$/, "");
        if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/i.test(url)) {
          els.endpointInput.value = url;
          log(`tunnel url loaded: ${url}`);
          saveState();
          render();
        }
      } catch (error) {
        log(`tunnel url load skipped: ${error.message}`);
      }
    }

    function fallbackReply(prompt) {
      return [
        "API 응답을 받지 못해 로컬 안내를 표시합니다.",
        "",
        `질문: ${prompt}`,
        "",
        "확인할 것:",
        "1. 오른쪽 API Base URL이 https://gilbert-bases-tracked-hopes.trycloudflare.com 처럼 https로 시작하는지 확인",
        "2. Cloudflare Quick Tunnel 주소가 바뀌었다면 새 주소를 붙여 넣기",
        "3. 로컬 서버가 http://localhost:3110 에서 켜져 있는지 확인"
      ].join("\n");
    }

    async function requestAI(prompt) {
      const model = els.modelInput.value.trim() || DEFAULT_MODEL;
      const conversation = currentConversation();
      const messages = [
        { role: "system", content: els.systemInput.value.trim() },
        ...conversation.messages.slice(-12).map((item) => ({ role: item.role, content: item.content }))
      ];

      const body = {
        model,
        messages,
        message: prompt,
        prompt,
        temperature: Number(els.temperatureInput.value)
      };

      // 웹 검색이 켜져 있으면 /api/ollama-chat-with-search 사용
      if (webSearchEnabled) {
        body.search_query = prompt;
        body.max_results = 5;
        return await requestAIWithSearch(body);
      }

      let lastError = null;
      for (const url of candidateChatUrls()) {
        try {
          const sameOriginProxy = url === "/api/ollama-chat";
          log(`POST ${url} model=${model}`);
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": sameOriginProxy ? "application/json" : "text/plain"
            },
            body: JSON.stringify(body)
          });

          const text = await response.text();
          if (!response.ok) {
            throw new Error(`${url} ${response.status} ${text.slice(0, 180)}`);
          }

          try {
            return normalizeReply(JSON.parse(text));
          } catch (error) {
            return text;
          }
        } catch (error) {
          lastError = error;
          log(`request failed on ${url}: ${error.message}`);
        }
      }

      throw lastError || new Error("all endpoints failed");
    }

    // 웹 검색 + AI 채팅 요청 (스마트 라우팅: 뉴스는 검색+요약, 일반은 바로 Ollama)
    async function requestAIWithSearch(body) {
      const model = body.model || DEFAULT_MODEL;
      const searchQuery = body.search_query || body.prompt || body.message || '';

      log(`POST /api/ollama-chat-with-search model=${model} search=on`);

      try {
        const response = await fetch("/api/ollama-chat-with-search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            messages: body.messages || [{ role: "user", content: searchQuery }],
            query: searchQuery,
            temperature: body.temperature || 0.35,
            num_predict: 1200
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(`search chat ${response.status}: ${data.error || 'unknown'}`);
        }

        // 검색 결과가 있으면 로그에 표시
        if (data.search?.results?.length > 0) {
          log(`web search: ${data.search.results.length} results`);
          data.search.results.slice(0, 3).forEach((item, i) => {
            log(`  [${i+1}] ${(item.title || 'untitled').slice(0, 50)}`);
          });
        }
        if (data.mode === 'smart-chat-news') {
          log(`mode: 뉴스 검색+요약 (${data.search?.fetched || 0}건 본문 추출)`);
        } else {
          log(`mode: 직접 응답`);
        }

        return {
          content: data.content || normalizeReply(data),
          search: data.search || null
        };
      } catch (error) {
        log(`smart chat failed: ${error.message}`);
        // 실패 시 일반 채팅으로 폴백
        log("falling back to normal chat...");
        for (const url of candidateChatUrls()) {
          try {
            const sameOriginProxy = url === "/api/ollama-chat";
            const fallbackRes = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": sameOriginProxy ? "application/json" : "text/plain" },
              body: JSON.stringify(body)
            });
            const text = await fallbackRes.text();
            if (fallbackRes.ok) return { content: normalizeReply(JSON.parse(text)), search: null };
          } catch (e) {}
        }
        throw error;
      }
    }

    async function submitPrompt(event) {
      event.preventDefault();
      const prompt = els.promptInput.value.trim();
      if (!prompt) return;

      const conversation = currentConversation();
      if (!conversation.title || conversation.title === "새 대화") {
        conversation.title = prompt.slice(0, 34);
      }

      conversation.messages.push({ role: "user", content: prompt, time: formatTime() });
      els.promptInput.value = "";
      els.sendButton.disabled = true;
      updateMetrics("실행");
      render();

      const started = performance.now();
      try {
        const reply = await requestAI(prompt);
        const ms = Math.round(performance.now() - started);
        els.latencyMetric.textContent = `${ms}ms`;

        // 웹 검색 결과를 메시지에 저장 (reply가 객체인 경우)
        let searchResults = null;
        let replyText = reply;
        if (typeof reply === 'object' && reply !== null) {
          replyText = reply.content || reply.text || JSON.stringify(reply);
          searchResults = reply.search?.results || null;
        }

        const msg = {
          role: "assistant",
          content: replyText,
          time: formatTime(),
          model: els.modelInput.value.trim()
        };
        if (searchResults) msg.searchResults = searchResults;
        conversation.messages.push(msg);

        setOnline(true, "AI 응답 완료");
        log(`response ok ${ms}ms`);
      } catch (error) {
        conversation.messages.push({
          role: "assistant",
          content: fallbackReply(prompt),
          time: formatTime(),
          model: "local-fallback"
        });
        setOnline(false, "API 응답 실패");
        log(`request failed: ${error.message}`);
      } finally {
        els.sendButton.disabled = false;
        updateMetrics("대기");
        render();
      }
    }

    function newChat() {
      const chat = createConversation("새 대화");
      state.conversations.unshift(chat);
      activeId = chat.id;
      render();
      els.promptInput.focus();
    }

    function clearCurrent() {
      const conversation = currentConversation();
      if (!conversation) return;
      conversation.messages = [];
      conversation.title = "새 대화";
      els.endpointInput.value = DEFAULT_ENDPOINT;
      log("current chat cleared");
      render();
    }

    async function copyChat() {
      const conversation = currentConversation();
      const text = (conversation?.messages || [])
        .map((item) => `${item.role.toUpperCase()}: ${item.content}`)
        .join("\n\n");
      if (!text) {
        log("copy skipped: empty chat");
        return;
      }
      await navigator.clipboard.writeText(text);
      log("chat copied to clipboard");
    }

    const savedEndpoint = (state.endpoint || "").replace(/\/$/, "");
    els.endpointInput.value = /^https?:\/\//i.test(savedEndpoint) && !LEGACY_ENDPOINTS.includes(savedEndpoint)
      ? savedEndpoint
      : DEFAULT_ENDPOINT;
    els.modelInput.value = LEGACY_MODELS.includes(state.model || "") ? DEFAULT_MODEL : (state.model || DEFAULT_MODEL);
    els.temperatureInput.value = state.temperature || "0.5";
    els.systemInput.value = state.system || els.systemInput.value;

    els.chatForm.addEventListener("submit", submitPrompt);
    els.newChatButton.addEventListener("click", newChat);
    els.clearButton.addEventListener("click", clearCurrent);
    els.copyButton.addEventListener("click", copyChat);
    els.healthButton.addEventListener("click", checkHealth);
    els.endpointInput.addEventListener("input", render);
    els.modelInput.addEventListener("input", saveState);
    els.temperatureInput.addEventListener("change", saveState);
    els.systemInput.addEventListener("input", saveState);

    // 웹 검색 토글 (초기 ON)
    const searchToggleBtn = document.querySelector("#searchToggleButton");
    searchToggleBtn.style.borderColor = "rgba(34, 197, 94, 0.8)";
    searchToggleBtn.style.background = "#166534";
    searchToggleBtn.style.color = "#ecfdf5";
    searchToggleBtn.textContent = "🔍 검색ON";
    searchToggleBtn.addEventListener("click", () => {
      webSearchEnabled = !webSearchEnabled;
      searchToggleBtn.style.borderColor = webSearchEnabled ? "rgba(34, 197, 94, 0.8)" : "rgba(100,100,100,0.3)";
      searchToggleBtn.style.background = webSearchEnabled ? "#166534" : "#182235";
      searchToggleBtn.style.color = webSearchEnabled ? "#ecfdf5" : "var(--text)";
      searchToggleBtn.textContent = webSearchEnabled ? "🔍 검색ON" : "🔍 웹검색";
      log(`web search ${webSearchEnabled ? "enabled" : "disabled"}`);
    });

    els.promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        els.chatForm.requestSubmit();
      }
    });

    document.querySelectorAll("[data-prompt]").forEach((button) => {
      button.addEventListener("click", () => {
        els.promptInput.value = button.dataset.prompt;
        els.promptInput.focus();
      });
    });

    log("참소식 Ollama IDE ready");
    log(`default endpoint: ${DEFAULT_ENDPOINT}/api/chat`);
    render();
    loadTunnelUrl();
    checkHealth();
  </script>
</body>
</html>
