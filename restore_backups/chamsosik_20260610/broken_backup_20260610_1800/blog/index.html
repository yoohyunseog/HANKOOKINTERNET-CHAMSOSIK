  <script>
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function renderPostCard(post) {
      const href = escapeHtml(post.href);
      const title = escapeHtml(post.title);
      const excerpt = escapeHtml(post.excerpt);
      const date = escapeHtml(post.date);
      const category = escapeHtml(post.category || '釉붾줈洹?);
      return `
        <article class="post-card">
          <div class="post-card-content">
            <div class="post-meta">
              <span class="post-date">${date}</span>
              <span class="post-category">${category}</span>
            </div>
            <h2><a href="${href}">${title}</a></h2>
            <p class="post-excerpt">${excerpt}</p>
            <a href="${href}" class="read-more">???쎄린 ??/a>
          </div>
        </article>
      `;
    }

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      if (!container) return;

      try {
        const response = await fetch('posts/index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`posts/index.json ${response.status}`);
        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) return;
        container.innerHTML = posts.map(renderPostCard).join('');
      } catch (error) {
        console.warn('Could not load posts/index.json; keeping static fallback.', error);
      }
    }
    
    // ?섏씠吏 濡쒕뱶 ???ㅽ뻾
    document.addEventListener('DOMContentLoaded', loadPosts);
  </script>
