<!DOCTYPE html>
<html lang="ko">
<head>    <!-- 도메인 검증 (모든 페이지에서 가장 먼저 실행되어야 함) -->
    

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x4jlyqheuh");
</script>
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">API 테스트</h1>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5><i class="bi bi-clock-history"></i> 최근 100개</h5>
          </div>
          <div class="card-body">
            <button class="btn btn-primary mb-3" onclick="testRecent()">
              <i class="bi bi-play-fill"></i> 테스트 실행
            </button>
            <div id="recent-result">
              <p class="text-muted">버튼을 클릭하세요</p>
            </div>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-danger text-white">
            <h5><i class="bi bi-fire"></i> 조회수 TOP 100</h5>
          </div>
          <div class="card-body">
            <button class="btn btn-danger mb-3" onclick="testMostViewed()">
              <i class="bi bi-play-fill"></i> 테스트 실행
            </button>
            <div id="popular-result">
              <p class="text-muted">버튼을 클릭하세요</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function testRecent() {
      const resultDiv = document.getElementById('recent-result');
      resultDiv.innerHTML = '<div class="spinner-border"></div> 로딩 중...';
      
      try {
        const response = await fetch('https://참소식.com/api/recent?limit=100');
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            <h6>✅ 성공!</h6>
            <p>총 ${data.count}개 조회됨</p>
          </div>
          <div style="max-height: 400px; overflow-y: auto;">
            ${data.results.slice(0, 10).map((item, i) => `
              <div class="border-bottom py-2">
                <span class="badge bg-secondary">#${i+1}</span>
                <strong>${item.type === 'text' ? item.input : item.input.join(',')}</strong>
                <br>
                <small class="text-muted">
                  조회수: ${item.view_count || 0} | 
                  ${new Date(item.timestamp).toLocaleString('ko-KR')}
                </small>
              </div>
            `).join('')}
            <p class="text-muted mt-2">... 외 ${data.count - 10}개</p>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert alert-danger">
            ❌ 오류: ${error.message}
          </div>
        `;
      }
    }

    async function testMostViewed() {
      const resultDiv = document.getElementById('popular-result');
      resultDiv.innerHTML = '<div class="spinner-border"></div> 로딩 중...';
      
      try {
        const response = await fetch('https://참소식.com/api/most-viewed?limit=100');
        const data = await response.json();
        
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            <h6>✅ 성공!</h6>
            <p>총 ${data.count}개 조회됨</p>
          </div>
          <div style="max-height: 400px; overflow-y: auto;">
            ${data.results.slice(0, 10).map((item, i) => `
              <div class="border-bottom py-2">
                ${i < 3 ? '🏆' : ''} 
                <span class="badge ${i < 3 ? 'bg-warning' : 'bg-secondary'}">#${i+1}</span>
                <span class="badge bg-danger">👁️ ${item.view_count || 0}회</span>
                <strong>${item.type === 'text' ? item.input : item.input.join(',')}</strong>
                <br>
                <small class="text-muted">
                  ${new Date(item.timestamp).toLocaleString('ko-KR')}
                </small>
              </div>
            `).join('')}
            <p class="text-muted mt-2">... 외 ${data.count - 10}개</p>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert alert-danger">
            ❌ 오류: ${error.message}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
