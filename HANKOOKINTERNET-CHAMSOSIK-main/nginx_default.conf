# HTTP: 한국인터넷.한국 (메인 도메인)
server {
    listen 80;
    listen [::]:80;
    server_name 한국인터넷.한국 xn--3e0bx5eku0am2irhf.xn--3e0b707e;

    # CORS 헤더
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 등록되지 않은 도메인 차단
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / {
        return 444;
    }
}

# HTTP: 참소식.com (리다이렉트 없이 직접 처리)
server {
    listen 80;
    listen [::]:80;
    server_name 참소식.com www.참소식.com xn--9l4b4xi9r.com www.xn--9l4b4xi9r.com;

    location / {
        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: 참소식.com (리다이렉트 없이 직접 처리)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 참소식.com www.참소식.com xn--9l4b4xi9r.com www.xn--9l4b4xi9r.com;

    ssl_certificate     /var/www/chamsosik/xn--9l4b4xi9r.com_2026060282F8C/xn--9l4b4xi9r.com_2026060282F8C.all.crt.pem;
    ssl_certificate_key /var/www/chamsosik/xn--9l4b4xi9r.com_2026060282F8C/xn--9l4b4xi9r.com_2026060282F8C.key.pem;

    root /var/www/chamsosik;
    index index.html index.htm;

    # 전역 CORS 헤더 (모든 경로에 적용)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    error_page 404 /ErrPage/404/index.html;
    error_page 500 502 503 504 /ErrPage/500/index.html;

    # API 프록시 (Node.js 서버로 전달)
    location /api/ {
        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /ErrPage/ {
        # Allow access to error page assets
    }
}
