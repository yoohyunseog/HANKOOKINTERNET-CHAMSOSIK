# HTTP: 한국인터넷.한국 (메인 도메인)
server {
    listen 80;
    listen [::]:80;
    server_name 한국인터넷.한국 xn--3e0bx5eku0am2irhf.xn--3e0b707e;

    # CORS 헤더
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 등록되지 않은 도메인 차단
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location / {
        return 444;
    }
}

# HTTP: 참소식.com (리다이렉트 없이 직접 처리)
server {
    listen 80;
    listen [::]:80;
    server_name xn--9l4b4xi9r.com www.xn--9l4b4xi9r.com;

    location / {
        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: 두 도메인 모두 동일하게 처리 (리다이렉트 없음)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--9l4b4xi9r.com www.xn--9l4b4xi9r.com;

    ssl_certificate     /var/www/chamsosik/xn--9l4b4xi9r.com_2026060282F8C/xn--9l4b4xi9r.com_2026060282F8C.all.crt.pem;
    ssl_certificate_key /var/www/chamsosik/xn--9l4b4xi9r.com_2026060282F8C/xn--9l4b4xi9r.com_2026060282F8C.key.pem;

    root /var/www/chamsosik;
    index index.html index.htm;

    # 전역 CORS 헤더 (모든 경로에 적용)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    # 보안 헤더 (혼합 콘텐츠 방지)
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 404 /ErrPage/404/index.html;
    error_page 500 502 503 504 /ErrPage/500/index.html;

    # board.php 크롤러 차단 및 410 Gone 응답 (우선순위 높임)
    location ^~ /bbs/board.php {
        if ($http_user_agent ~* "(meta-externalagent|facebookexternalhit)") {
            return 444;
        }
        return 410;
    }
    
    location ^~ /bbs/ {
        return 410;
    }

    # API 프록시 (Node.js 서버로 전달)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # RSS/Sitemap 프록시
    location = /feed.xml {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed-popular.xml {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /ErrPage/ {
        # Allow access to error page assets
    }
}
